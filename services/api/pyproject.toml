[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "automation-reliability-api"
version = "0.1.0"
description = "Processing service for the Automation Reliability Console."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.51.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<0.16"
]

[tool.hatch.build.targets.wheel]
packages = ["src/arc_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["arc_api"]
mypy_path = "src"
